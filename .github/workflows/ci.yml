name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # Only trusted main-branch pushes use the local runner pool.
    # Pull requests and other branches stay on GitHub-hosted machines.
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted","macOS","ARM64","mac-runner"]') || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/ai-agents/bridge.test.mjs
      - run: python3 scripts/check-branding.py
      - run: >
          xcodebuild -project notch.xcodeproj -scheme notch
          -destination 'platform=macOS' CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
          -only-testing:notchtests/AgentEventBridgeTests
          -only-testing:notchtests/NotchAIAgentEventsHandlerTests
          -only-testing:notchtests/AIAgentsViewModelTests
          -only-testing:notchtests/AgentSessionStoreTests
          -only-testing:notchtests/AppBrandingTests
          -only-testing:notchtests/LocalizationCatalogTests test -quiet
